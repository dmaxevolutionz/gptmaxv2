name: Auto Update GPTmax V2 advance Data

on:
  schedule:
    - cron: '0 10 * * 1-5' # Berjalan otomatis Senin-Jumat jam 17:00 WIB
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run Data Generator
        run: python generator.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add emiten.js
          git diff-index --quiet HEAD || git commit -m "auto: update emiten.js GPTmax V2 advance [skip ci]"
          git push
